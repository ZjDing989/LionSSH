name: Build and publish release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v1.7.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate version, updater configuration and signing secret
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/ci-release.cjs validate
      - name: Prepare draft release
        id: release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          retries: 3
          script: |
            const release = require('./scripts/ci-release.cjs');
            await release.prepareRelease({ github, context, core });

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            asset_platform: windows
            asset_arch: x64
          - runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            asset_platform: macos
            asset_arch: aarch64
          - runner: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            asset_platform: macos
            asset_arch: x86_64
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
            asset_platform: linux
            asset_arch: x86_64
    name: ${{ matrix.asset_platform }} ${{ matrix.asset_arch }}
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libssl-dev
      - name: Install frontend and build dependencies
        run: npm ci
      - name: Check package privacy and release metadata
        run: node --test tests/packaging.test.cjs
      - name: Build frontend and license resources for native tests
        run: |
          npm run build:frontend
          npm run prepare:licenses
      - name: Test Windows backend and native SSH integration
        if: runner.os == 'Windows'
        run: npm test
      - name: Test Windows renderer in Chrome
        if: runner.os == 'Windows'
        run: npm run test:ui
      - name: Test Rust backend on macOS and Linux
        if: runner.os != 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build and upload signed native bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          uploadPlainBinary: false
          retryAttempts: 3
          tauriScript: npm run tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci -- --locked
          releaseAssetNamePattern: Lion-SSH-[version]-${{ matrix.asset_platform }}-${{ matrix.asset_arch }}[setup][ext]
      - name: Create and sign the Windows multi-file portable ZIP
        if: runner.os == 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/package.cjs --skip-build --target x86_64-pc-windows-msvc --sign-portable
      - name: Upload signed Windows portable assets
        if: runner.os == 'Windows'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          retries: 3
          script: |
            const release = require('./scripts/ci-release.cjs');
            await release.uploadWindowsPortable({ github, context, core });

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - name: Validate every signed target, publish latest.json and release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          retries: 3
          script: |
            const release = require('./scripts/ci-release.cjs');
            await release.finalizeRelease({ github, context, core });
